{% extends "basic.html" %}
{% block body %}
<!--header for the fish section-->
<h1>Fishing-guide section:</h1>

<!--layout of the fishing section-->
<div class="three-column">
    {% for fishing in items %}
    <a href="fish/{{fishing[0]}}">
    <div class="w3-card-4">
        <h1>{{ fishing[1] }}</h1>
        <img src="{{ fishing [2] }}" alt="{{ fishing[1] }}">
    </div>
    </a>
    {% endfor %}
</div>
{% endblock %}
