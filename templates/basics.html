<!DOCTYPE html>
<html lang="en">

<!--Global head configuration, links external W3.CSS, Google Web Fonts, and local CSS-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Righteous">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>Welcome to Stardew Valley Guide Book!</title>
</head>

<!--the header for all the pages-->
<body>
  <!-- Header banner with background gradient overlay configured in CSS -->
  <header>
    <h1>Stardew Valley</h1>
    <p>Create the farm of your dreams: Turn your overgrown fields into a lively and bountiful farm! </p>
  </header>

<!-- Global Navigation Bar providing direct access to core entity pages -->>
  <div class="navbar">
    <a class="active" href="/">Home</a>
    <a href="/fishing">Fishing</a>
    <a href="/farm">The Farm</a>
    <a href="/planting">Planting</a>
    <a href="/npc">NPC</a>
  </div>

  <!--Inline utility toolbar housing global search component and relational seasonal filter -->
  <div class="toolbar-inline">
    <!--Reusable search bar component included via Jinja2 template partial -->
    {% include "searchbar.html" %}

    <!--Seasonal dropdown filter querying relational SQLite database records -->
    <div class="dropdown">
      <button class="dropbtn">Stardew Categories ▾</button>
      <div class="dropdown-content">
        <a href="/season/Spring">Spring</a>
        <a href="/season/Summer">Summer</a>
        <a href="/season/Fall">Fall</a>
        <a href="/season/Winter">Winter</a>
      </div>
    </div>
  </div>

<!--Dynamic main content area inherited and populated by child templates -->
<div class="w3-container w3-padding-32">
    {% block body %}
    {% endblock %}
</div> 

<!--Persistent footer section across all pages -->
<footer>
  <h2>Contact us: StardewValleyWiki@gmail.com</h2>
</footer>
</body>
</html>
