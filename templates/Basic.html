<!DOCTYPE html>
<html lang="en">

<!--initial settings: using font type in w3 and link html with css-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Righteous">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <meta charset="UTF-8">
  <title>Welcome to Stardew Valley Guide Book!</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<!--the header for all the pages-->
<body>
  <header>
    <h1>Stardew Valley</h1>
    <p>Create the farm of your dreams: Turn your overgrown fields into a lively and bountiful farm! </p>
  </header>

<!--navigation bar with the links to the specific page -->
  <div class="navbar">
    <a class="active" href="/">Home</a>
    <a href="/fishing">Fishing</a>
    <a href="/farm">The Farm</a>
    <a href="/planting">Planting</a>
    <a href="/npc">NPC</a>
  </div>

  <div class="toolbar-inline">
    <!--search bar-->
    {% include "searchbar.html" %}

    <!--dropdown filter that goes to the sepcific label-->
    <div class="dropdown">
      <button class="dropbtn">Stardew Categories ▾</button>
      <div class="dropdown-content">
        <a href="/season/Spring">Spring</a>
        <a href="/season/Summer">Summer</a>
        <a href="/season/Fall">Fall</a>
        <a href="/season/Winter">Winter</a>
      </div>
    </div>
  </div>

<!--main content area-->
<div class="w3-container w3-padding-32">
    {% block body %}
    {% endblock %}
</div> 

<!--footer that stays at the bottom on every page-->
<footer>
  <h2>Contact us: StardewValleyWiki@gmail.com</h2>
</footer>
</body>
</html>
